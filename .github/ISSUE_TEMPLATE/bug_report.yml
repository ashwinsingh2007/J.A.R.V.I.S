name: Bug report
description: JARVIS did something wrong, misheard you, or stopped working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste your memory, journal, config or logs without reading them first. Remove names, emails, keys and anything personal.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you said or did, what you expected, and what JARVIS did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Say "Jarvis, wake up"
        2. Say "..."
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JARVIS version or commit
      placeholder: 0.2.0, or the commit hash
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M2
  - type: dropdown
    id: brain
    attributes:
      label: Brain
      options:
        - Claude Code
        - Anthropic API
        - Ollama
  - type: dropdown
    id: voice
    attributes:
      label: Voice engine
      options:
        - Kokoro
        - ElevenLabs
        - Edge
        - macOS
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The relevant lines from ~/.jarvis/jarvis.log, with personal details removed.
      render: text
