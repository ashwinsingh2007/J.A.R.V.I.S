name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Skip install scripts: they download Electron, which the checks below don't need.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh native/build-hands.sh
      - run: test -x resources/jarvis-hands && resources/jarvis-hands >/dev/null
