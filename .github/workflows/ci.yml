name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The syntax check and the unit tests need no Electron, no microphone and no
  # display, so they run on every platform JARVIS is meant to reach.
  check:
    strategy:
      # Let each OS report on its own, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Skip install scripts: they download Electron, which the checks below don't need.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh native/build-hands.sh
      - run: test -x resources/jarvis-hands && resources/jarvis-hands >/dev/null
